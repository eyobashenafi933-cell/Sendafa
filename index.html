<style>
:root{--bg:#E9F1EE;--surface:#fff;--ink:#17302A;--muted:#5B746C;--green:#2E5E4E;--hay:#E8B94A;--berry:#B8456B;--line:#CFDDD7}
@media (prefers-color-scheme:dark){:root{--bg:#101C19;--surface:#1A2B26;--ink:#E8F0EC;--muted:#9DB5AC;--green:#4E9A7F;--line:#2B403A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Ethiopic","Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:12px 16px 96px}
h1{font-size:28px;font-weight:800;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
.top{display:flex;justify-content:flex-end}
.lang{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
nav button{flex:1;max-width:130px;padding:10px 4px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:600 14px inherit;font-family:inherit}
nav button.on{background:var(--green);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.pic{width:100%;aspect-ratio:1;border-radius:16px;object-fit:cover;background:var(--hay);display:block;margin-bottom:12px}
.pic.sm{width:52px;height:52px;border-radius:50%;margin:0;flex:none}
.name{font-size:22px;font-weight:800;margin:0}
.meta{color:var(--muted);margin:2px 0 8px}
.badge{display:inline-block;background:var(--hay);color:#17302A;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle}
.tag{display:inline-block;background:var(--bg);border-radius:99px;padding:3px 12px;margin:0 6px 6px 0;font-size:14px}
.lbl{font-weight:600;font-size:14px;color:var(--muted);margin:10px 0 2px}
.row{display:flex;gap:12px;margin-top:14px}
.btn{flex:1;padding:14px;border:0;border-radius:14px;font:700 16px inherit;font-family:inherit;color:#fff;background:var(--green);cursor:pointer}
.btn.like{background:var(--berry)}
.btn.pass,.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.sm{flex:none;padding:8px 14px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:16px inherit;font-family:inherit}
textarea{min-height:80px}
.m{display:flex;gap:12px;align-items:center}
.msg{color:var(--muted);text-align:center;padding:30px 10px}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.err{color:var(--berry);font-weight:600;margin-top:10px}
.hero{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;text-align:center}
.sun{width:96px;height:96px;border-radius:50%;background:var(--hay);margin:0 auto 22px;box-shadow:0 0 0 14px rgba(232,185,74,.25)}
.hero h1{font-size:38px;line-height:1.1}
.hero .card{text-align:left;margin-top:8px}
.link{background:none;border:0;color:var(--muted);font:600 14px inherit;font-family:inherit;text-decoration:underline;margin-top:10px;cursor:pointer}
.price{font-size:30px;font-weight:800;color:var(--berry);margin:4px 0}
.ap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.cn{flex:1;font-size:18px}.tg{text-decoration:none;background:var(--green);color:#fff;border-color:var(--green)}
.msgs{height:calc(100vh - 260px);min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0}
.b{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.b.me{align-self:flex-end;background:var(--green);color:#fff;border-color:var(--green)}
.send{display:flex;gap:8px;margin-top:8px}.send input{flex:1}
:focus-visible{outline:3px solid var(--hay);outline-offset:2px}
</style>
</head>

{id:"s5",name:{am:"ቤተልሔም",en:"Bethlehem"},age:24,area:{am:"ተራራ ሥር",en:"Hill side"},about:{am:"በጤና ጣቢያ ነርስ ነኝ። ተራራ መውጣትና ጎረቤት መርዳት እወዳለሁ።",en:"Nurse at the clinic. I enjoy hiking and helping neighbours."},looking:{am:"የሚያድግ ጓደኝነት",en:"Friendship that grows"},interests:{am:"ሩጫ, ጤና, የመዘምራን ቡድን",en:"Hiking, Health, Choir"},pic:av({bg:"#DCEBF2",skin:"#8A5A3C",hair:"#1d1410",dress:"#6F4A8E",style:"bun"})},
{id:"s6",name:{am:"ራሄል",en:"Rahel"},age:22,area:{am:"ሰሜን መጨረሻ",en:"North end"},about:{am:"አዲስ አበባ ኮሌጅ እማራለሁ፣ ለበዓል ቤት መጥቻለሁ።",en:"Studying in Addis, home for the holidays."},looking:{am:"ሥራ ወዳድ ሰው",en:"Someone ambitious"},interests:{am:"ትምህርት, ፎቶ, ዳንስ",en:"Studying, Photography, Dancing"},pic:av({bg:"#F0C987",skin:"#A06C49",hair:"#1d1410",dress:"#2E5E4E",style:"short"})}
];
const L=x=>x&&typeof x==="object"?x[lang]:x;

/* ---------- state ---------- */
const configured=firebaseConfig.apiKey!=="PASTE_HERE";
let app_,auth,db;
let user=null,uid=null,authReady=false,isAdmin=false,approved=false,paySent=false,editPay=false,paidStarted=false;
let tab="meet",mode="login",err="",profiles={},outL=new Set(),inL=new Set(),contacts={},myContact="",settings={},payments={},approvals={};
let passed=new Set(),subs=[],chatWith=null,chatUnsub=null,msgs=[];
try{JSON.parse(LS.g("vm_pass")||"[]").forEach(x=>passed.add(x))}catch(e){}
const paid=()=>isAdmin||approved,mine=()=>profiles[uid];
const matchIds=()=>[...outL].filter(id=>inL.has(id));
const toEmail=s=>{s=s.trim().toLowerCase();if(s.includes("@"))return s;let d=s.replace(/\D/g,"");if(d.startsWith("0"))d="251"+d.slice(1);return d+"@phone.sendafabeke.app"};
const pair=id=>[uid,id].sort().join("_");
function pic(p,cls){const src=p.photo||p.pic;return src?`<img class="pic ${cls||""}" src="${src}" alt="${esc(L(p.name))}">`:`<div class="pic ${cls||""}"></div>`}
const topbar=()=>`<div class="top"><button class="lang" id="lang">${lang==="am"?"English":"አማርኛ"}</button></div>`;
const bindLang=()=>{const b=$("#lang");if(b)b.onclick=()=>setLang(lang==="am"?"en":"am")};
function tgLink(c){c=String(c||"").trim();if(!c)return"";if(/^\+?[\d\s-]{7,}$/.test(c)){let d=c.replace(/\D/g,"");if(!c.startsWith("+")&&d.startsWith("0"))d="251"+d.slice(1);return "https://t.me/+"+d}const u=c.replace(/^@/,"");return /^[A-Za-z0-9_]{4,}$/.test(u)?"https://t.me/"+u:""}
const clearSubs=()=>{subs.forEach(f=>{try{f()}catch(e){}});subs=[];closeChat()};
function closeChat(){if(chatUnsub){chatUnsub();chatUnsub=null}chatWith=null;msgs=[]}

/* ---------- data ---------- */
async function loadContacts(){for(const id of matchIds()){if(contacts[id]!==undefined)continue;contacts[id]="";try{const s=await getDoc(doc(db,"contacts",id));contacts[id]=s.exists()?s.data().contact||"":""}catch(e){}}render()}
function startPaid(){
  if(paidStarted)return;paidStarted=true;
  subs.push(onSnapshot(collection(db,"profiles"),s=>{profiles={};s.forEach(d=>profiles[d.id]=d.data());render()},()=>{}));
  subs.push(onSnapshot(query(collection(db,"likes"),where("from","==",uid)),s=>{outL=new Set();s.forEach(d=>outL.add(d.data().to));loadContacts()},()=>{}));
  subs.push(onSnapshot(query(collection(db,"likes"),where("to","==",uid)),s=>{inL=new Set();s.forEach(d=>inL.add(d.data().from));loadContacts()},()=>{}));
  getDoc(doc(db,"contacts",uid)).then(s=>{myContact=s.exists()?s.data().contact||"":""}).catch(()=>{});
  if(isAdmin){
    subs.push(onSnapshot(collection(db,"payments"),s=>{payments={};s.forEach(d=>payments[d.id]=d.data());render()},()=>{}));
    subs.push(onSnapshot(collection(db,"approvals"),s=>{approvals={};s.forEach(d=>approvals[d.id]=d.data());render()},()=>{}));
  }
}
async function onUser(u){
  clearSubs();paidStarted=false;user=u;uid=u?u.uid:null;isAdmin=false;approved=false;paySent=false;profiles={};outL=new Set();inL=new Set();contacts={};
  authReady=true;
  if(!u){render();return}
  try{isAdmin=(await getDoc(doc(db,"admins",uid))).exists()}catch(e){}
  subs.push(onSnapshot(doc(db,"settings","pay"),s=>{settings=s.exists()?s.data():{};render()},()=>{}));
  subs.push(onSnapshot(doc(db,"payments",uid),s=>{paySent=s.exists();render()},()=>{}));
  subs.push(onSnapshot(doc(db,"approvals",uid),s=>{approved=s.exists();if(paid())startPaid();render()},()=>{}));
  if(isAdmin)startPaid();
  render();
}

/* ---------- views ---------- */
function render(){
  const root=$("#app"),nav=$("#nav");
  if(!configured){nav.hidden=true;root.innerHTML=`<div class="hero"><h1>SENDAFA BEKE</h1><p class="sub">Setup needed: paste your Firebase settings at the top of index.html.</p></div>`;return}
  if(!authReady){root.innerHTML=`<p class="msg">…</p>`;return}
  if(!user)return renderAuth();
  if(!paid())return renderPay();
  nav.hidden=false;
  const tabs=[["meet","meet"],["matches","matches"],["me","me"]];if(isAdmin)tabs.push(["ap","approve"]);
  nav.innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" class="${tab===k?"on":""}">${t(l)}</button>`).join("");
  if(tab==="me")return renderProfile();
  if(tab==="ap"&&isAdmin)return renderApprove();
  if(tab==="matches"){if(chatWith){if(!$("#msgs"))renderChat();return}return renderMatches()}
  renderMeet();
}
function renderAuth(){
  $("#nav").hidden=true;
  const reg=mode==="register";
  $("#app").innerHTML=topbar()+`<div class="hero"><div class="sun"></div><h1>SENDAFA BEKE</h1><p class="sub">${t("tag")}</p>
  <div class="card"><label for="a_id">${t("phone")}</label><input id="a_id" autocomplete="username" inputmode="email"><label for="a_pw">${t("pw")}</label><input id="a_pw" type="password" autocomplete="${reg?"new-password":"current-password"}">
  ${err?`<div class="err">${esc(err)}</div>`:""}<div class="row"><button class="btn" id="a_go">${reg?t("register"):t("login")}</button></div>
  <div style="text-align:center"><button class="link" id="a_mode">${reg?t("tolog"):t("toreg")}</button></div></div>
  <button class="btn sec" id="share">${t("share")}</button></div>`;
  bindLang();
  $("#a_mode").onclick=()=>{mode=reg?"login":"register";err="";render()};
  $("#share").onclick=async()=>{const url=location.href.split("#")[0];try{if(navigator.share){await navigator.share({title:"SENDAFA BEKE",url});return}}catch(e){if(e&&e.name==="AbortError")return}try{await navigator.clipboard.writeText(url);alert(t("copied"))}catch(e){prompt(t("share"),url)}};
  const go=async()=>{const id=$("#a_id").value,pw=$("#a_pw").value;if(!id.trim()||!pw){err=t("errfill");return render()}
    try{err="";if(reg)await createUserWithEmailAndPassword(auth,toEmail(id),pw);else await signInWithEmailAndPassword(auth,toEmail(id),pw)}
    catch(e){const c=e.code||"";err=c.includes("email-already")?t("errused"):c.includes("weak")?t("errweak"):(c.includes("credential")||c.includes("password")||c.includes("user-not-found")||c.includes("invalid"))?t("errbad"):t("errnet");render()}};
  $("#a_go").onclick=go;$("#a_pw").onkeydown=e=>{if(e.key==="Enter")go()};
}
function renderMeet(){
  const real=Object.keys(profiles).filter(id=>id!==uid&&!outL.has(id)&&!passed.has(id)).map(id=>({id,p:profiles[id],sample:false}));
  const smp=SAMPLES.filter(x=>!passed.has(x.id)).map(x=>({id:x.id,p:x,sample:true}));
  const list=real.concat(smp);
  let h=topbar()+`<h1>${t("meetT")}</h1><p class="sub">${t("meetS")}</p>`+(mine()?"":`<p class="note" style="margin:-8px 0 14px">${t("addprof")}</p>`);
  if(!list.length)h+=`<div class="card msg">${t("noface")}<br><button class="link" id="again">${t("again")}</button></div>`;
  h+=list.map(({id,p,sample})=>`<div class="card">${pic(p)}<p class="name">${esc(L(p.name))}, ${esc(p.age)}${sample?`<span class="badge">${t("sample")}</span>`:""}</p><p class="meta">${esc(L(p.area))}</p>
  ${p.about?`<div class="lbl">${t("about")}</div><div>${esc(L(p.about))}</div>`:""}${p.looking?`<div class="lbl">${t("looking")}</div><div>${esc(L(p.looking))}</div>`:""}
  ${p.interests?`<div class="lbl">${t("likes").split(" (")[0]}</div><div>${String(L(p.interests)).split(",").map(x=>x.trim()).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}
  <div class="row"><button class="btn pass" data-pass="${id}">${t("pass")}</button><button class="btn like" data-like="${id}" data-s="${sample?1:0}">${t("like")}</button></div></div>`).join("");
  $("#app").innerHTML=h;bindLang();
  const ag=$("#again");if(ag)ag.onclick=()=>{passed.clear();LS.r("vm_pass");render()};
  document.querySelectorAll("[data-pass]").forEach(b=>b.onclick=()=>{passed.add(b.dataset.pass);LS.s("vm_pass",JSON.stringify([...passed]));render()});
  document.querySelectorAll("[data-like]").forEach(b=>b.onclick=async()=>{const id=b.dataset.like;
    if(b.dataset.s==="1"){const n=L(SAMPLES.find(x=>x.id===id).name);passed.add(id);alert(n+t("samplemsg"));return render()}
    try{await setDoc(doc(db,"likes",uid+"_"+id),{from:uid,to:id,at:Date.now()});if(inL.has(id))alert(t("itsmatch")+profiles[id].name+"!")}catch(e){alert(t("saveerr"))}});
}
function renderMatches(){
  const ids=matchIds();
  let h=topbar()+`<h1>${t("matchT")}</h1><p class="sub">${t("matchS")}</p>`;
  if(!ids.length)h+=`<div class="card msg">${t("nomatch")}</div>`;
  else h+=ids.map(id=>{const p=profiles[id]||{},c=contacts[id]||"";
    return `<div class="card m">${pic(p,"sm")}<div><b>${esc(p.name)}, ${esc(p.age)}</b><br><span class="meta">${esc(p.area)}</span><br>${c?t("reach")+esc(c):t("nocontact")}</div><button class="btn sm" style="margin-left:auto" data-chat="${id}">${t("chat")}</button></div>`}).join("");
  const w=[...outL].filter(id=>!inL.has(id)).length;if(w)h+=`<p class="note">${t("waiting")}${w}</p>`;
  $("#app").innerHTML=h;bindLang();
  document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>{chatWith=b.dataset.chat;render()});
}
function drawMsgs(){const el=$("#msgs");if(!el)return;el.innerHTML=msgs.map(m=>`<div class="b ${m.from===uid?"me":""}">${esc(m.text)}</div>`).join("")||`<div class="msg">${t("nomsg")}</div>`;el.scrollTop=el.scrollHeight}
function renderChat(){
  const id=chatWith,p=profiles[id]||{},link=tgLink(contacts[id]),path=["chats",pair(id),"messages"];
  $("#app").innerHTML=`<div class="chat-head"><button class="lang" id="back">${t("back")}</button><b class="cn">${esc(p.name)}</b>${link?`<a class="lang tg" href="${link}" target="_blank" rel="noopener">Telegram</a>`:`<span class="note" style="margin:0">${t("notg")}</span>`}</div><div id="msgs" class="msgs"></div><div class="send"><input id="mtxt" maxlength="500" placeholder="${t("type")}"><button class="btn sm" id="msend">${t("send")}</button></div>`;
  $("#back").onclick=()=>{closeChat();render()};
  const go=async()=>{const i=$("#mtxt"),text=i.value.trim();if(!text)return;i.value="";try{await addDoc(collection(db,...path),{from:uid,text,at:Date.now()})}catch(e){i.value=text;alert(t("saveerr"))}};
  $("#msend").onclick=go;$("#mtxt").onkeydown=e=>{if(e.key==="Enter")go()};
  if(chatUnsub){chatUnsub();chatUnsub=null}msgs=[];drawMsgs();
  chatUnsub=onSnapshot(query(collection(db,...path),orderBy("at")),s=>{msgs=s.docs.map(d=>d.data());drawMsgs()},()=>{});
}
function renderProfile(){
  const p=mine()||{};
  $("#app").innerHTML=topbar()+`<h1>${mine()?t("profT"):t("joinT")}</h1><p class="sub">${t("profS")}</p>
  <div class="card"><label for="f_photo">${t("photo")}</label><img class="pic" id="prev" alt="" ${p.photo?`src="${p.photo}"`:"hidden"}><input id="f_photo" type="file" accept="image/*">
  <label for="f_name">${t("fname")}</label><input id="f_name" value="${esc(p.name)}" maxlength="30">
  <label for="f_age">${t("age")}</label><input id="f_age" type="number" inputmode="numeric" min="18" max="99" value="${esc(p.age)}">
  <label for="f_area">${t("area")}</label><input id="f_area" value="${esc(p.area)}" maxlength="40">
  <label for="f_about">${t("about")}</label><textarea id="f_about" maxlength="300">${esc(p.about)}</textarea>
  <label for="f_looking">${t("looking")}</label><input id="f_looking" value="${esc(p.looking)}" maxlength="80">
  <label for="f_int">${t("likes")}</label><input id="f_int" value="${esc(p.interests)}" maxlength="100">
  <label for="f_contact">${t("contact")}</label><input id="f_contact" value="${esc(myContact)}" maxlength="60">
  <p class="note">${t("cnote")}</p><div class="row"><button class="btn" id="save">${t("save")}</button></div></div>
  <div style="text-align:center"><button class="link" id="logout">${t("logout")}</button></div>`;
  bindLang();let photo=p.photo||"";
  $("#logout").onclick=()=>signOut(auth);
  $("#f_photo").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=240;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);photo=c.toDataURL("image/jpeg",.72);const pv=$("#prev");pv.src=photo;pv.hidden=false};im.src=URL.createObjectURL(f)};
  $("#save").onclick=async()=>{const v=id=>$("#"+id).value.trim(),age=parseInt(v("f_age"),10);
    if(!v("f_name")||!v("f_area"))return alert(t("needname"));if(!(age>=18))return alert(t("need18"));
    try{await setDoc(doc(db,"profiles",uid),{name:v("f_name"),age,area:v("f_area"),about:v("f_about"),looking:v("f_looking"),interests:v("f_int"),photo});
      await setDoc(doc(db,"contacts",uid),{contact:v("f_contact")});myContact=v("f_contact");tab="meet";render()}catch(e){alert(t("saveerr"))}};
}
function renderPay(){
  const s=settings,sent=paySent&&!editPay;
  $("#nav").hidden=true;
  $("#app").innerHTML=topbar()+`<h1>${t("payT")}</h1><p class="sub">${t("payS")}</p><div class="card">
  ${s.price?`<div class="price">${esc(s.price)}</div><div class="lbl">${t("payTo")}</div><div><b>${esc(s.method)}</b> ${esc(s.number)}</div>`:`<div class="msg">${t("payWait")}</div>`}
  ${sent?`<p class="note"><b>${t("paysent2")}</b> · ${t("paysent")}</p><div class="row"><button class="btn sec" id="chg">${t("payagain")}</button></div>`:
  `<label for="p_name">${t("payname")}</label><input id="p_name" maxlength="50"><label for="p_ref">${t("payref")}</label><input id="p_ref" maxlength="40"><div class="row"><button class="btn" id="send">${t("paysend")}</button></div>`}</div>
  <div style="text-align:center"><button class="link" id="logout">${t("logout")}</button></div>`;
  bindLang();
  $("#logout").onclick=()=>signOut(auth);
  const c=$("#chg");if(c)c.onclick=()=>{editPay=true;render()};
  const b=$("#send");if(b)b.onclick=async()=>{const n=$("#p_name").value.trim(),r=$("#p_ref").value.trim();if(!n||!r)return alert(t("payneed"));
    try{await setDoc(doc(db,"payments",uid),{name:n,ref:r,at:Date.now()});editPay=false}catch(e){alert(t("saveerr"))}};
}
function renderApprove(){
  const ids=Object.keys(payments).sort((a,b)=>(payments[b].at||0)-(payments[a].at||0)),s=settings;
  $("#app").innerHTML=topbar()+`<h1>${t("apT")}</h1><p class="sub">${t("apS")}</p><div class="card">`+
  (ids.length?ids.map(id=>{const p=payments[id],ok=!!approvals[id];
    return `<div class="ap"><div><b>${esc(p.name)}</b><br><span class="meta">${esc(p.ref)}</span></div><button class="btn sm ${ok?"sec":""}" data-a="${id}" data-ok="${ok?0:1}">${ok?t("aprev"):t("apok")}</button></div>`}).join(""):`<div class="msg">${t("apnone")}</div>`)+
  `</div><h1 style="font-size:22px">${t("setT")}</h1><div class="card"><label for="s_price">${t("price")}</label><input id="s_price" value="${esc(s.price)}"><label for="s_method">${t("method")}</label><input id="s_method" value="${esc(s.method)}"><label for="s_num">${t("num")}</label><input id="s_num" value="${esc(s.number)}"><div class="row"><button class="btn" id="s_save">${t("setsave")}</button></div></div>`;
  bindLang();
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const id=b.dataset.a;
    try{if(b.dataset.ok==="1")await setDoc(doc(db,"approvals",id),{ok:true});else await deleteDoc(doc(db,"approvals",id))}catch(e){alert(t("saveerr"))}});
  $("#s_save").onclick=async()=>{try{await setDoc(doc(db,"settings","pay"),{price:$("#s_price").value.trim(),method:$("#s_method").value.trim(),number:$("#s_num").value.trim()});alert(t("saved"))}catch(e){alert(t("saveerr"))}};
}
$("#nav").onclick=e=>{const k=e.target.dataset&&e.target.dataset.t;if(k){tab=k;closeChat();render()}};

if(configured){app_=initializeApp(firebaseConfig);auth=getAuth(app_);db=getFirestore(app_);onAuthStateChanged(auth,onUser)}else{authReady=true;render()}
</script>
</body>
</html>
