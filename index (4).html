}

  const mo=$("#more");if(mo)mo.onclick=loadMore;
  const ag=$("#again");if(ag)ag.onclick=()=>{passed.clear();LS.r("vm_pass");render()};
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openProfile(b.dataset.open,b.dataset.s==="1"));

function renderMatches(){

function drawMsgs(){const el=$("#msgs");if(!el)return;
  el.innerHTML=msgs.map(m=>`<div class="b ${m.from===uid?"me":""}">${esc(m.text)}<small>${new Date(m.at||0).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</small></div>`).join("")||`<div class="msg">${t("nomsg")}</div>`;
  el.scrollTop=el.scrollHeight;if(chatWith)LS.s("vm_read_"+pair(chatWith),Date.now())}
function renderChat(){
  const id=chatWith,p=profiles[id]||{},link=tgLink(contacts[id]),path=["chats",pair(id),"messages"];
  $("#app").innerHTML=`<div class="chat-head"><button class="lang" id="back" aria-label="${t("back")}">←</button><div class="who" id="who"><span class="avw">${pic(p,"sm")}</span><span><b>${esc(p.name)}</b>${verified.has(id)?vbadge():""}<small>${esc(p.age)} · ${esc(p.area)} ${olTag(id)}</small></span></div>${link?`<a class="lang tg" href="${link}" target="_blank" rel="noopener">Telegram</a>`:""}</div><div id="pd" class="card" hidden>${pdHTML(p)}</div><div id="msgs" class="msgs"></div><div class="send"><input id="mtxt" maxlength="500" placeholder="${t("type")}"><button class="btn sm" id="msend">${t("send")}</button></div>`;

  $("#who").onclick=()=>{const d=$("#pd");d.hidden=!d.hidden;$("#msgs").style.display=d.hidden?"":"none"};
  const go=async()=>{const i=$("#mtxt"),text=i.value.trim();if(!text)return;i.value="";
    try{await addDoc(collection(db,...path),{from:uid,text,at:Date.now()});await setDoc(doc(db,"chats",pair(id)),{from:uid,at:Date.now(),text:text.slice(0,60)})}catch(e){i.value=text;alert(t("saveerr"))}};
  $("#msend").onclick=go;$("#mtxt").onkeydown=e=>{if(e.key==="Enter")go()};
  if(chatUnsub){chatUnsub();chatUnsub=null}msgs=[];drawMsgs();paintOnline();
  chatUnsub=onSnapshot(query(collection(db,...path),orderBy("at")),s=>{msgs=s.docs.map(d=>d.data());drawMsgs()},()=>{});
  loadHD(id).then(()=>{const d=$("#pd");if(d&&chatWith===id)d.innerHTML=pdHTML(profiles[id])});

function renderProfile(setup){
  if(!setup&&mine()&&hasPhoto(mine())&&!editing)return renderMine();
  const p=mine()||{};
  let photos=(p.photos&&p.photos.length?p.photos:(p.photo||p.thumb?[p.photo||p.thumb]:[])).slice(0,3);
  $("#app").innerHTML=topbar()+`<h1>${setup?t("setupT"):mine()?t("profT"):t("joinT")}</h1><p class="sub">${setup?t("setupS"):t("profS")}</p>
  <div class="card"><label>${t("photosL")}</label><div class="slots">${[0,1,2].map(i=>`<label class="slot">${photos[i]?`<img src="${photos[i]}" alt="">`:"<span>+</span>"}<input type="file" accept="image/*" data-slot="${i}" hidden></label>`).join("")}</div>

  <label for="f_age">${t("age")}</label><input id="f_age" type="number" inputmode="numeric" min="18" max="99" value="${esc(p.age)}">
  <label for="f_area">${t("area")}</label><input id="f_area" value="${esc(p.area)}" maxlength="40">
  <label for="f_about">${t("about")}</label><textarea id="f_about" maxlength="300">${esc(p.about)}</textarea>
  <label for="f_looking">${t("looking")}</label><input id="f_looking" value="${esc(p.looking)}" maxlength="80">
  <label for="f_int">${t("likes")}</label><input id="f_int" value="${esc(p.interests)}" maxlength="100">
  <label for="f_contact">${t("contact")}</label><input id="f_contact" value="${esc(myContact)}" maxlength="60">
  <p class="note">${t("cnote")}</p><div class="row"><button class="btn" id="save">${t("save")}</button></div></div>
  <div style="text-align:center"><button class="link" id="logout">${t("logout")}</button></div>`;
  bindLang();
  $("#logout").onclick=()=>signOut(auth);
  document.querySelectorAll("[data-slot]").forEach(inp=>inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;const i=+inp.dataset.slot,d=await shrink(f,900,.85,250000,true);photos[i]=d;const sl=inp.parentElement;sl.innerHTML=`<img src="${d}" alt="">`;sl.appendChild(inp)});
  $("#save").onclick=async()=>{const v=id=>$("#"+id).value.trim(),age=parseInt(v("f_age"),10);
    if(!v("f_name")||!v("f_area"))return alert(t("needname"));if(!(age>=18))return alert(t("need18"));if(!photos.filter(Boolean).length)return alert(t("photoneed"));
    const hd=photos.filter(Boolean);try{const thumb=await thumbFrom(hd[0]);await setDoc(doc(db,"photos",uid),{list:hd});await setDoc(doc(db,"profiles",uid),{name:v("f_name"),age,area:v("f_area"),about:v("f_about"),looking:v("f_looking"),interests:v("f_int"),thumb});
      await setDoc(doc(db,"contacts",uid),{contact:v("f_contact")});myContact=v("f_contact");const first=!mine()||!hasPhoto(mine());profiles[uid]={name:v("f_name"),age,area:v("f_area"),about:v("f_about"),looking:v("f_looking"),interests:v("f_int"),thumb,photos:hd,hd:1,hdp:Promise.resolve()};editing=false;tab=first?"meet":"me";toast(t("savedOk"));render()}catch(e){alert(t("saveerr"))}};
}
