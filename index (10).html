function shrink(f,max,q,lim,sq){return new Promise(res=>{const im=new Image();im.onload=()=>{let sw=im.width,sh=im.height,sx=0,sy=0,dw,dh;
  if(sq){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;dw=dh=Math.min(max,m)}else{const k=Math.min(1,max/Math.max(sw,sh));dw=Math.round(sw*k);dh=Math.round(sh*k)}
  const c=document.createElement("canvas");c.width=dw;c.height=dh;const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(im,sx,sy,sw,sh,0,0,dw,dh);
  let d=c.toDataURL("image/jpeg",q);while(d.length>lim&&q>.4){q-=.1;d=c.toDataURL("image/jpeg",q)}res(d)};im.src=URL.createObjectURL(f)})}

let statCache={t:0,m:"…",o:"…",d:"…"};
async function loadStats(){
  const paint=()=>{[["st_m","m"],["st_o","o"],["st_d","d"]].forEach(([id,k])=>{const e=$("#"+id);if(e)e.textContent=statCache[k]})};
  paint();if(Date.now()-statCache.t<60000)return;statCache.t=Date.now();
  const cnt=async q=>{try{return (await getCountFromServer(q)).data().count}catch(e){return "?"}};
  statCache.m=await cnt(collection(db,"profiles"));paint();
  statCache.o=await cnt(query(collection(db,"presence"),where("at",">",Date.now()-480000)));paint();
  statCache.d=await cnt(query(collection(db,"presence"),where("last",">",Date.now()-86400000)));paint();
